<!doctype html>
<!--
PROTOTYPE - descartavel.
Question: One dashboard direction using the warm/teal design system, with `cuts`, `income` and `wealth` tabs, switchable via `?tab=`.
Run by opening this file in a browser.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GranaApp - Dashboard Decision Prototype</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f4f0e8;
      --ink: #17231f;
      --muted: rgba(23, 35, 31, .62);
      --soft: rgba(23, 35, 31, .07);
      --line: rgba(23, 35, 31, .13);
      --paper: rgba(255, 252, 245, .76);
      --paper-solid: #fffaf0;
      --teal: #117a68;
      --teal-2: #0c5f53;
      --green: #147c56;
      --red: #c9413a;
      --amber: #d8912b;
      --gold: #edb85f;
      --dark: #17231f;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, monospace;
      --shadow: 0 22px 72px rgba(41, 33, 22, .14);
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: var(--font);
      letter-spacing: 0;
      background:
        radial-gradient(circle at 8% 8%, rgba(237, 184, 95, .34), transparent 24%),
        radial-gradient(circle at 88% 0%, rgba(17, 122, 104, .26), transparent 25%),
        linear-gradient(135deg, #f8f3e8, #edf4ef);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(23, 35, 31, .025) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 35, 31, .02) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: .7;
    }

    button { font: inherit; }
    h1, h2, h3, p { margin: 0; }

    .money {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    .glass {
      border: 1px solid var(--line);
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(132%);
      -webkit-backdrop-filter: blur(26px) saturate(132%);
    }

    .screen {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 18px 22px 92px 88px;
    }

    .rail {
      position: fixed;
      left: 18px;
      top: 18px;
      bottom: 18px;
      z-index: 12;
      display: grid;
      align-content: start;
      gap: 9px;
      width: 54px;
      padding: 8px;
      border-radius: 22px;
    }

    .rail button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 14px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 17px;
      font-weight: 860;
    }

    .rail .on {
      color: #fff9ed;
      background: var(--dark);
      box-shadow: 0 13px 28px rgba(23, 35, 31, .22);
    }

    .shell {
      max-width: 1540px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 60px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #28c840; }

    .brand h1 {
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0;
    }

    .tabs {
      display: flex;
      gap: 6px;
      border-radius: 999px;
      padding: 6px;
    }

    .tab {
      border: 0;
      border-radius: 999px;
      padding: 9px 13px;
      color: var(--ink);
      background: transparent;
      font-size: 13px;
      font-weight: 820;
      cursor: pointer;
    }

    .tab.on {
      color: #fff9ed;
      background: linear-gradient(135deg, var(--dark), var(--teal));
      box-shadow: 0 16px 34px rgba(17, 122, 104, .22);
    }

    .focus {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .focus.wealth {
      grid-template-columns: 1.18fr repeat(3, 1fr);
    }

    .focus.income {
      grid-template-columns: 1.18fr repeat(3, 1fr);
    }

    .hero-card,
    .panel,
    .fact,
    .action-card {
      border-radius: 22px;
    }

    .hero-card {
      min-height: 146px;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .hero-card.primary {
      color: #fff9ed;
      background:
        linear-gradient(135deg, rgba(23, 35, 31, .98), rgba(17, 122, 104, .9));
      border: 1px solid rgba(255, 249, 237, .15);
      box-shadow: 0 26px 74px rgba(17, 122, 104, .24);
    }

    .money-flow-card {
      display: grid;
      align-content: start;
      gap: 9px;
    }

    .money-flow-card .value {
      margin-top: 6px;
      font-size: 31px;
    }

    .surplus-card {
      display: grid;
      align-content: start;
    }

    .surplus-source {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 820;
    }

    .surplus-source strong {
      color: var(--ink);
      font-family: var(--mono);
      font-weight: 920;
    }

    .surplus-card .value {
      margin-top: 6px;
      font-size: 31px;
    }

    .cash-compact-card {
      display: grid;
      align-content: start;
      gap: 9px;
    }

    .cash-compact-card .value {
      margin-top: 6px;
      font-size: 31px;
    }

    .compact-source {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 62px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 820;
    }

    .compact-source b {
      overflow: hidden;
      color: var(--ink);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compact-source span {
      font: 820 11px/1 var(--mono);
      text-align: right;
      white-space: nowrap;
    }

    .split-bar {
      display: flex;
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(23, 35, 31, .08);
    }

    .split-bar i:first-child {
      width: 47%;
      background: linear-gradient(90deg, var(--teal), var(--green));
    }

    .split-bar i:last-child {
      width: 53%;
      background: linear-gradient(90deg, var(--gold), var(--red));
    }

    .flow-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .flow-rows {
      display: grid;
      gap: 4px;
      margin-top: 1px;
    }

    .flow-row strong {
      color: var(--ink);
      font-family: var(--mono);
      font-weight: 940;
    }

    .label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .primary .label { color: rgba(255, 249, 237, .72); }

    .value {
      margin-top: 15px;
      font-size: 44px;
      font-weight: 940;
      line-height: .95;
    }

    .delta {
      display: inline-flex;
      margin-top: 13px;
      border-radius: 999px;
      padding: 6px 9px;
      color: var(--delta-ink, #10352f);
      background: var(--delta-bg, rgba(17, 122, 104, .14));
      font-size: 12px;
      font-weight: 850;
    }

    .delta.good {
      color: #0b4f3b;
      background: rgba(20, 124, 86, .15);
    }

    .delta.bad {
      color: #8d2b25;
      background: rgba(201, 65, 58, .14);
    }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 2px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .panel {
      padding: 16px;
    }

    .panel h2 {
      font-size: 15px;
      letter-spacing: 0;
    }

    .sub {
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .fact {
      min-height: 82px;
      padding: 12px;
      background: rgba(23, 35, 31, .045);
      border: 1px solid rgba(23, 35, 31, .06);
    }

    .fact strong {
      display: block;
      margin-top: 8px;
      font-size: 23px;
      line-height: 1;
    }

    .variance-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .variance-row {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 52px;
      gap: 10px;
      align-items: center;
      min-height: 30px;
    }

    .variance-row b {
      overflow: hidden;
      color: var(--ink);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .axis {
      height: 12px;
      border-radius: 999px;
      background: rgba(23, 35, 31, .08);
      overflow: hidden;
    }

    .axis i {
      display: block;
      height: 100%;
      width: var(--w);
      border-radius: inherit;
      background: var(--tone);
    }

    .impact {
      text-align: right;
    }

    .impact strong {
      color: var(--tone);
      font: 850 12px/1 var(--mono);
    }

    .bar-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 62px;
      gap: 10px;
      align-items: center;
      min-height: 30px;
    }

    .bar-row b {
      color: var(--ink);
      font-size: 12px;
    }

    .track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(23, 35, 31, .08);
    }

    .track i {
      display: block;
      width: var(--w);
      height: 100%;
      border-radius: inherit;
      background: var(--tone, var(--teal));
    }

    .bar-row span {
      color: var(--muted);
      font: 800 12px/1 var(--mono);
      text-align: right;
    }

    .budget-list {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .budget-row {
      display: grid;
      grid-template-columns: 88px 34px minmax(0, 1fr) 70px;
      gap: 9px;
      align-items: center;
      min-height: 30px;
    }

    .budget-row b {
      overflow: hidden;
      color: var(--ink);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .budget-tag {
      display: inline-grid;
      place-items: center;
      min-width: 34px;
      height: 20px;
      border-radius: 999px;
      color: var(--tone);
      background: rgba(23, 35, 31, .06);
      font: 880 10px/1 var(--mono);
    }

    .budget-row strong {
      color: var(--ink);
      font: 880 12px/1 var(--mono);
      text-align: right;
      white-space: nowrap;
    }

    .budget-row.fixed b,
    .budget-row.fixed strong {
      color: rgba(23, 35, 31, .56);
    }

    .budget-row.fixed .budget-tag {
      color: rgba(23, 35, 31, .46);
      background: rgba(23, 35, 31, .045);
    }

    .budget-row.fixed .track i {
      opacity: .34;
    }

    .budget-footer {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid rgba(23, 35, 31, .08);
    }

    .mix-bar {
      display: flex;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(23, 35, 31, .08);
    }

    .mix-bar i:first-child {
      width: 62%;
      background: rgba(23, 35, 31, .34);
    }

    .mix-bar i:last-child {
      flex: 1;
      background: var(--teal);
    }

    .budget-ratio {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      color: var(--muted);
      font: 800 11px/1 var(--mono);
    }

    .risk-scale {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 6px;
      color: var(--muted);
      font: 750 10px/1 var(--mono);
    }

    .risk-scale span:last-child {
      text-align: right;
    }

    .timeline {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .due {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 44px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(23, 35, 31, .09);
    }

    .due:last-child { border-bottom: 0; }

    .date {
      display: grid;
      place-items: center;
      width: 38px;
      height: 32px;
      border-radius: 11px;
      color: #fff9ed;
      background: var(--dark);
      font-size: 12px;
      font-weight: 900;
    }

    .due b {
      display: block;
      font-size: 13px;
    }

    .due span {
      color: var(--muted);
      font-size: 12px;
    }

    .due .money {
      color: var(--red);
      font-size: 13px;
      font-weight: 860;
    }

    .flow-positive .due .money {
      color: var(--green);
    }

    .status {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      padding: 10px;
      border-radius: 16px;
      color: #fff9ed;
    }

    .status.good {
      background: linear-gradient(135deg, var(--green), var(--teal));
      box-shadow: 0 16px 36px rgba(20, 124, 86, .18);
    }

    .status.warn {
      background: linear-gradient(135deg, var(--amber), var(--gold));
      box-shadow: 0 16px 36px rgba(216, 145, 43, .18);
    }

    .status.bad {
      background: linear-gradient(135deg, var(--red), #d87942);
      box-shadow: 0 16px 36px rgba(201, 65, 58, .18);
    }

    .status-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .18);
      font-weight: 900;
    }

    .status b {
      display: block;
      font-size: 13px;
    }

    .status span {
      color: rgba(255, 249, 237, .78);
      font-size: 12px;
    }

    .wealth-chart {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .y-axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--muted);
      font: 750 11px/1 var(--mono);
      text-align: right;
    }

    .bars {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      align-items: end;
      gap: 7px;
      height: 116px;
      padding-top: 6px;
      border-bottom: 1px solid rgba(23, 35, 31, .18);
    }

    .bars i {
      height: var(--h);
      min-height: 10px;
      border-radius: 999px 999px 6px 6px;
      background: linear-gradient(180deg, var(--teal), var(--gold));
      box-shadow: 0 10px 22px rgba(17, 122, 104, .18);
    }

    .x-axis {
      grid-column: 2;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font: 750 11px/1 var(--mono);
    }

    .action-card {
      padding: 14px;
      background: var(--paper-solid);
      border: 1px solid var(--line);
    }

    .action-card strong {
      display: block;
      font-size: 24px;
      line-height: 1.05;
    }

    .action-card p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .action-card.featured {
      color: #fff9ed;
      background:
        linear-gradient(135deg, rgba(23, 35, 31, .98), rgba(17, 122, 104, .9));
      border-color: rgba(255, 249, 237, .16);
      box-shadow: 0 22px 58px rgba(17, 122, 104, .22);
    }

    .action-card.featured p {
      color: rgba(255, 249, 237, .74);
    }

    details.state {
      position: fixed;
      right: 18px;
      bottom: 20px;
      z-index: 25;
      width: min(380px, calc(100vw - 36px));
      max-height: 58vh;
      overflow: auto;
      padding: 10px 12px;
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 252, 245, .9);
      border: 1px solid var(--line);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .18);
    }

    details.state summary {
      cursor: pointer;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    details.state pre {
      margin: 10px 0 0;
      white-space: pre-wrap;
      font: 11px/1.45 var(--mono);
    }

    @media (max-width: 1100px) {
      .screen { padding: 86px 18px 92px; }
      .rail {
        right: 18px;
        bottom: auto;
        width: auto;
        grid-auto-flow: column;
      }
      .focus,
      .focus.wealth,
      .focus.income,
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .screen { padding: 14px 14px 92px; }
      .top {
        grid-template-columns: 1fr;
      }
      .tabs {
        justify-content: stretch;
      }
      .tab {
        flex: 1;
      }
      .facts {
        grid-template-columns: 1fr;
      }
      .value {
        font-size: 36px;
      }
      details.state { display: none; }
    }
  </style>
</head>
<body>
  <main id="root"></main>

    ];

      ["Musica", "ativo", "R$ 100", "ok", "#147c56"],
      ["Streaming video", "sem uso recente", "R$ 79", "rev", "#d8912b"],

    ];

    const incomeSources = [
      ["Salario", "R$ 9.800", "79%", "#117a68"],
      ["Freelance", "R$ 1.760", "14%", "#edb85f"],
      ["Dividendos", "R$ 340", "3%", "#147c56"],
      ["Outros", "R$ 500", "4%", "#d8912b"]
    ];

    const sourceReturns = [
      ["Consultoria", "R$ 120/h", "82%", "#117a68"],
      ["Freelance fixo", "R$ 45/h", "42%", "#d8912b"],
      ["Dividendos", "R$ 340 / 0h", "100%", "#147c56"],
      ["Outros", "R$ 28/h", "26%", "#c9413a"]
    ];

    const incomeEvents = [
      ["25", "Salario", "confirmado", "R$ 9.800"],
      ["29", "Freelance app", "a receber", "R$ 1.200"],
      ["05", "Dividendos", "estimado", "R$ 340"]
    ];

    const moneyFlow = {
      total: "R$ 11.584",
      patrimony: "R$ 5.400",
      consumption: "R$ 6.184",
      patrimonyShare: "47%",
      consumptionShare: "53%",

    const cashPlan = {
      income: "R$ 12.400",
      consumed: "R$ 6.184",
      invested: "R$ 5.400",
      availableNow: "R$ 816",
      committedWithoutOverlap: "R$ 420",
      trulyFree: "R$ 396",
      preservedRate: "50%",
      overlapRule: "Contas a vencer so entram no calculo quando nao repetem consumo ja reconhecido; fatura de cartao exige conciliacao."
    };

    const cashAvailability = {
      monthFree: "R$ 396",
      totalCash: "R$ 18.240",
      sources: [
        ["Conta corrente", "R$ 4.920", "27%", "#117a68"],
        ["Reserva liquida", "R$ 12.900", "71%", "#147c56"],
        ["Outros saldos", "R$ 420", "2%", "#d8912b"]
      ]
    };

    const realSurplus = {
      totalCash: "R$ 18.240",
      dueThisMonth: "R$ 5.759",
      availableAfterDebts: "R$ 12.481",
      rule: "disponibilidade menos dividas e compromissos a vencer no mes"
    };

    const burnRate = {
      dailyFree: "R$ 42/dia",
      currentVariablePace: "R$ 128/dia",
      safeVariablePace: "R$ 170/dia",
      daysLeft: "10 dias",
      projectedClose: "R$ 396",
      paceRows: [
        ["Ritmo atual", "R$ 128/dia", "75%", "#117a68"],
        ["Limite seguro", "R$ 170/dia", "100%", "#d8912b"]
      ]
    };

    function currentTab() {
      const param = new URLSearchParams(location.search).get("tab") || "cuts";
      return tabLabels[param] ? param : "cuts";
    }

    function setTab(nextTab) {
      const url = new URL(location.href);
      url.searchParams.set("tab", nextTab);
      history.replaceState({}, "", url);
      render();
    }

    function cycleTab(direction) {
      const keys = Object.keys(tabLabels);
      const index = keys.indexOf(currentTab());
      setTab(keys[(index + direction + keys.length) % keys.length]);
    }

    function dots() {
      return `<div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>`;
    }

    function rail() {
      return `
        <nav class="rail glass" aria-label="Menu">
          <button class="on">⌂</button><button>◍</button><button>▥</button><button>◇</button><button>↗</button><button>✦</button>
        </nav>
      `;
    }

    function topCard(item) {
      if (!Array.isArray(item) && item.type === "moneyFlow") return moneyFlowTopCard();
      if (!Array.isArray(item) && item.type === "realSurplus") return realSurplusTopCard();
      if (!Array.isArray(item) && item.type === "cashAvailability") return compactAvailabilityTopCard();
      const [label, value, delta, tone, scope] = item;
      const primary = tone === "primary";
      return `
        <article class="hero-card ${primary ? "primary" : "glass"}">
          <div class="label"><span>${label}</span><span>${scope}</span></div>
          <div class="value money">${value}</div>
          <span class="delta ${tone}">${delta}</span>
        </article>
      `;
    }

    function compactAvailabilityTopCard() {
      const visibleSources = cashAvailability.sources.filter(item => item[0] !== "Outros saldos");
      return `
        <article class="hero-card glass cash-compact-card">
          <div class="label"><span>Disponibilidade</span><span>caixa</span></div>
          <div class="value money">${cashAvailability.totalCash}</div>
          ${visibleSources.map(item => `
            <div class="compact-source" style="--tone:${item[3]}">
              <b>${item[0]}</b><div class="track"><i style="--w:${item[2]}"></i></div><span>${item[1]}</span>
            </div>
          `).join("")}
        </article>
      `;
    }

    function realSurplusTopCard() {
      return `
        <article class="hero-card glass surplus-card">
          <div class="label"><span>Sobra real</span><span>decisao</span></div>
          <div class="value money">${realSurplus.availableAfterDebts}</div>
          <span class="delta neutral">menos ${realSurplus.dueThisMonth} a vencer</span>
        </article>
      `;
    }

    function moneyFlowTopCard() {
      return `
        <article class="hero-card glass money-flow-card">
          <div class="label"><span>Total movimentado</span><span>mes</span></div>
          <div class="value money">${moneyFlow.total}</div>
          <div class="split-bar" aria-label="${moneyFlow.patrimonyShare} virou patrimonio e ${moneyFlow.consumptionShare} foi consumo"><i></i><i></i></div>
          <div class="flow-rows">
            <div class="flow-row"><strong>${moneyFlow.patrimony} investidos</strong><strong>${moneyFlow.consumption} consumidos</strong></div>
          </div>
        </article>
      `;
    }

    function tabs(tab) {
      return `
        <div class="tabs glass" role="tablist" aria-label="Visao do dashboard">
          ${Object.entries(tabLabels).map(([key, label]) => `
            <button class="tab ${tab === key ? "on" : ""}" type="button" role="tab" aria-selected="${tab === key}" onclick="setTab('${key}')">${label}</button>
          `).join("")}
        </div>
      `;
    }

    function categoryPanel(title, direction) {
      const rows = categoryVariance
        .filter(row => row[6] === direction)
        .sort((a, b) => b[3] - a[3]);
      const scope = "ordenado por R$";
      return `
        <article class="panel glass">
          <div class="label"><span>${title}</span><span>${scope}</span></div>
          <div class="variance-list">
            ${rows.map(row => `
              <div class="variance-row" style="--tone:${row[5]}">
                <b>${row[0]}</b>
                <div class="axis" title="${row[2]} vs media" aria-label="${row[0]}: ${row[1]}, impacto ${row[2]}"><i style="--w:${row[4]}"></i></div>
                <div class="impact"><strong>${row[1]}</strong></div>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function categoryBudgetPanel() {
      const rows = [...categoryBudget].sort((a, b) => b[3] - a[3]);
      return `
        <article class="panel glass">
          <div class="label"><span>Peso do orçamento</span><span>categoria</span></div>
          <div class="budget-list">
            ${rows.map(row => `
              <div class="budget-row ${row[1] === "FIX" ? "fixed" : "variable"}" style="--tone:${row[5]}" title="${row[0]}: ${row[2]} no mes, ${row[1]}">
                <b>${row[0]}</b>
                <span class="budget-tag">${row[1]}</span>
                <div class="track"><i style="--w:${row[4]}"></i></div>
                <strong class="money">${row[2]}</strong>
              </div>
            `).join("")}
          </div>
          <div class="budget-footer">
            <div class="mix-bar" title="62% fixo / 38% variavel"><i></i><i></i></div>
            <div class="budget-ratio"><span>62% fixo</span><span>38% variavel</span></div>
          </div>
        </article>
      `;
    }

    function incomeCompositionPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Receita do mes</span><span>composicao</span></div>
          <div class="facts">
            <div class="fact"><span class="sub">Total</span><strong class="money">R$ 12.400</strong></div>
            <div class="fact"><span class="sub">Fontes</span><strong class="money">4</strong></div>
          </div>
          <div class="bar-list">
            ${incomeSources.map(item => `
              <div class="bar-row" style="--tone:${item[3]};--w:${item[2]}">
                <b>${item[0]}</b><div class="track"><i></i></div><span>${item[1]}</span>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function sourceReturnPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Retorno por fonte</span><span>R$ / hora</span></div>
          <div class="bar-list">
            ${sourceReturns.map(item => `
              <div class="bar-row" style="--tone:${item[3]};--w:${item[2]}">
                <b>${item[0]}</b><div class="track"><i></i></div><span>${item[1]}</span>
              </div>
            `).join("")}
          </div>
          <div class="status good"><span class="status-icon">✓</span><div><b>Consultoria lidera retorno ativo</b><span>dividendos entram como renda passiva na mesma regua</span></div></div>
        </article>
      `;
    }

    function incomeEventsPanel() {
      return `
        <article class="panel glass flow-positive">
          <div class="label"><span>Entradas previstas</span><span>30 dias</span></div>
          <div class="timeline">
            ${incomeEvents.map(item => `
              <div class="due">
                <div class="date">${item[0]}</div>

    function costOfLivingPanel() {
      return `

            <div class="fact"><span class="sub">Media 6m</span><strong class="money">R$ 5.720</strong></div>
          </div>
          <div class="status warn"><span class="status-icon">!</span><div><b>R$ 464 acima da media</b><span>alta concentrada em gastos variaveis</span></div></div>

    function commitmentsPanel() {
      return `
        <article class="panel glass">

          <div class="timeline">
            ${commitments.map(item => `
              <div class="due">
                <div class="date">${item[0]}</div>

                <strong class="money">${item[3]}</strong>
              </div>
            `).join("")}
          </div>
          <div class="status warn"><span class="status-icon">!</span><div><b>Impacto depende da conciliacao</b><span>fatura pode conter compras ja classificadas como consumo</span></div></div>
        </article>
      `;
    }

    function burnRatePanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Burn rate</span><span>projecao</span></div>
          <div class="facts">
            <div class="fact"><span class="sub">Sobra por dia</span><strong class="money">${burnRate.dailyFree}</strong></div>
            <div class="fact"><span class="sub">Restam</span><strong class="money">${burnRate.daysLeft}</strong></div>
          </div>
          <div class="bar-list">
            ${burnRate.paceRows.map(item => `
              <div class="bar-row" style="--tone:${item[3]};--w:${item[2]}">
                <b>${item[0]}</b><div class="track"><i></i></div><span>${item[1]}</span>
              </div>
            `).join("")}
          </div>
          <div class="status good"><span class="status-icon">✓</span><div><b>Fecha em ${burnRate.projectedClose} se mantiver o ritmo</b><span>acima de ${burnRate.safeVariablePace} por dia a sobra final comeca a cair</span></div></div>
        </article>
      `;
    }

    function investmentEventsPanel() {
      return `
        <article class="panel glass flow-positive">
          <div class="label"><span>Eventos da carteira</span><span>30 dias</span></div>
          <div class="timeline">
            ${investmentEvents.map(item => `
              <div class="due">
                <div class="date">${item[0]}</div>

    function wealthPanel() {

          <div class="facts">
            <div class="fact"><span class="sub">Aportes</span><strong class="money">R$ 5.400</strong></div>
            <div class="fact"><span class="sub">Rend. mes</span><strong class="money">R$ 820</strong></div>
          </div>
        </article>
      `;
    }

    function allocationPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Carteira</span><span>alocacao</span></div>
          <div class="bar-list">
            ${allocation.map(item => `
              <div class="bar-row" style="--tone:#117a68;--w:${item[2]}">
                <b>${item[0]}</b><div class="track"><i></i></div><span>${item[1]}</span>
              </div>
            `).join("")}
          </div>
          <div class="status good"><span class="status-icon">✓</span><div><b>Alocacao dentro da meta</b><span>rebalanceamento nao urgente</span></div></div>
        </article>
      `;
    }

    function bigExpensesPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Maiores gastos</span><span>mes</span></div>
          <div class="timeline">
            ${bigExpenses.map((item, index) => `
              <div class="due">
                <div class="date">${index + 1}</div>
                <div><b>${item[0]}</b><span>${item[2]}</span></div>
                <strong class="money">${item[1]}</strong>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function invisibleExpensesPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Gastos invisiveis</span><span>mes</span></div>
          <div class="timeline">
            ${invisibleExpenses.map(item => `
              <div class="due">
                <div class="date">${item[1]}</div>
                <div><b>${item[0]}</b><span>nenhum isolado passa de R$ 30</span></div>
                <strong class="money" style="color:${item[3]}">${item[2]}</strong>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function recurringPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Recorrentes</span><span>mes</span></div>
          <div class="timeline">
            ${subscriptions.map(item => `
              <div class="due">
                <div class="date">${item[3]}</div>
                <div><b>${item[0]}</b><span>${item[1]}</span></div>
                <strong class="money" style="color:${item[4]}">${item[2]}</strong>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function riskPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Riscos da carteira</span><span>0 baixo / 100 alto</span></div>
          <div class="bar-list">
            ${riskScores.map(item => `
              <div class="bar-row" style="--tone:${item[3]};--w:${item[2]}">
                <b>${item[0]}</b><div class="track"><i></i></div><span>${item[1]}</span>
              </div>
            `).join("")}
          </div>
          <div class="risk-scale"><span>0</span><span>100</span></div>
          <div class="status good"><span class="status-icon">✓</span><div><b>Sem concentracao critica</b><span>maior ativo em 11% da carteira</span></div></div>
        </article>
      `;
    }

    function actionPanel(copy, featured = false) {
      return `
        <article class="action-card ${featured ? "featured" : ""}">
          <strong>${copy.title}</strong>
          <p>${copy.body}</p>
        </article>
      `;
    }

    function columnsFor(tab) {
      if (tab === "wealth") {
        return [
          [wealthPanel()],
          [allocationPanel(), riskPanel()],
          [investmentEventsPanel(), actionPanel({ title: "Agenda sem urgencia", body: "Proximo evento relevante e o aporte automatico. Sem vencimento critico nesta semana." })]
        ];
      }

      if (tab === "income") {
        return [
          [incomeCompositionPanel(), costOfLivingPanel()],
          [sourceReturnPanel(), incomeEventsPanel()],
          [actionPanel({ title: "Direcionar energia para consultoria", body: "R$ 120/h supera freelance fixo e nao compete com dividendos, que ficam como renda passiva." }, true)]
        ];
      }

      return [
        [invisibleExpensesPanel(), recurringPanel(), bigExpensesPanel()],
        [categoryPanel("Onde mais subiu", "pos"), categoryPanel("Onde mais poupei", "neg"), categoryBudgetPanel()],
        [burnRatePanel(), commitmentsPanel()]
      ];
    }

    function renderDashboard(tab) {
      const columns = columnsFor(tab);
      const sections = sectionsByTab[tab];
      return `
        <section class="screen">
          ${rail()}
          <div class="shell">
            <header class="top">
              <div class="brand">${dots()}<h1>Saude financeira</h1></div>
              ${tabs(tab)}
            </header>

            <section class="focus ${tab}">
              ${topCards[tab].map(topCard).join("")}
            </section>

            <section class="main-grid">
              ${columns.map((items, index) => `
                <div class="stack">
                  <div class="section-title"><span>${sections[index]}</span></div>
                  ${items.join("")}
                </div>
              `).join("")}
            </section>
          </div>
        </section>
      `;
    }

    function state() {
      const tab = currentTab();
      return `
        <details class="state">
          <summary>Estado</summary>
          <pre>${JSON.stringify({ tab, topCards: topCards[tab], moneyFlow, cashPlan, cashAvailability, realSurplus, burnRate, categoryVariance, categoryBudget, commitments, investmentEvents, incomeSources, sourceReturns, incomeEvents, allocation, riskScores, subscriptions }, null, 2)}</pre>
        </details>
      `;
    }

    function render() {
      const tab = currentTab();
      document.getElementById("root").innerHTML = `${renderDashboard(tab)}${state()}`;
    }

    addEventListener("keydown", event => {
      const target = event.target;
      const tag = target && target.tagName ? target.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || target.isContentEditable) return;
      if (event.key === "ArrowLeft") cycleTab(-1);
      if (event.key === "ArrowRight") cycleTab(1);
    });

    render();
  </script>
</body>
</html>
