<!doctype html>
<!--
PROTOTYPE - descartavel.
Question: Three dashboard layout directions using the same warm/teal design system, each with `cuts` and `wealth` tabs, switchable via `?variant=` and `?tab=`.
Run by opening this file in a browser.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grana AI - Dashboard Decision Prototype</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f4f0e8;
      --ink: #17231f;
      --muted: rgba(23, 35, 31, .62);
      --soft: rgba(23, 35, 31, .07);
      --line: rgba(23, 35, 31, .13);
      --paper: rgba(255, 252, 245, .76);
      --paper-solid: #fffaf0;
      --teal: #117a68;
      --teal-2: #0c5f53;
      --green: #147c56;
      --red: #c9413a;
      --amber: #d8912b;
      --gold: #edb85f;
      --dark: #17231f;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, monospace;
      --shadow: 0 22px 72px rgba(41, 33, 22, .14);
      --switcher-bg: #08090d;
      --switcher-fg: #f7f8fb;
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: var(--font);
      letter-spacing: 0;
      background:
        radial-gradient(circle at 8% 8%, rgba(237, 184, 95, .34), transparent 24%),
        radial-gradient(circle at 88% 0%, rgba(17, 122, 104, .26), transparent 25%),
        linear-gradient(135deg, #f8f3e8, #edf4ef);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(23, 35, 31, .025) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 35, 31, .02) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: .7;
    }

    button { font: inherit; }
    h1, h2, h3, p { margin: 0; }

    .money {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    .glass {
      border: 1px solid var(--line);
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(132%);
      -webkit-backdrop-filter: blur(26px) saturate(132%);
    }

    .screen {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 18px 22px 92px 88px;
    }

    .rail {
      position: fixed;
      left: 18px;
      top: 18px;
      bottom: 18px;
      z-index: 12;
      display: grid;
      align-content: start;
      gap: 9px;
      width: 54px;
      padding: 8px;
      border-radius: 22px;
    }

    .rail button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 14px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 17px;
      font-weight: 860;
    }

    .rail .on {
      color: #fff9ed;
      background: var(--dark);
      box-shadow: 0 13px 28px rgba(23, 35, 31, .22);
    }

    .shell {
      max-width: 1540px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 60px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #28c840; }

    .brand h1 {
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0;
    }

    .tabs {
      display: flex;
      gap: 6px;
      border-radius: 999px;
      padding: 6px;
    }

    .tab {
      border: 0;
      border-radius: 999px;
      padding: 9px 13px;
      color: var(--ink);
      background: transparent;
      font-size: 13px;
      font-weight: 820;
      cursor: pointer;
    }

    .tab.on {
      color: #fff9ed;
      background: linear-gradient(135deg, var(--dark), var(--teal));
      box-shadow: 0 16px 34px rgba(17, 122, 104, .22);
    }

    .focus {
      display: grid;
      grid-template-columns: 1fr 1.18fr 1fr;
      gap: 12px;
    }

    .focus.wealth {
      grid-template-columns: 1.18fr repeat(3, 1fr);
    }

    .hero-card,
    .panel,
    .fact,
    .action-card {
      border-radius: 22px;
    }

    .hero-card {
      min-height: 146px;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .hero-card.primary {
      color: #fff9ed;
      background:
        linear-gradient(135deg, rgba(23, 35, 31, .98), rgba(17, 122, 104, .9));
      border: 1px solid rgba(255, 249, 237, .15);
      box-shadow: 0 26px 74px rgba(17, 122, 104, .24);
    }

    .label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .primary .label { color: rgba(255, 249, 237, .72); }

    .value {
      margin-top: 15px;
      font-size: 44px;
      font-weight: 940;
      line-height: .95;
    }

    .delta {
      display: inline-flex;
      margin-top: 13px;
      border-radius: 999px;
      padding: 6px 9px;
      color: var(--delta-ink, #10352f);
      background: var(--delta-bg, rgba(17, 122, 104, .14));
      font-size: 12px;
      font-weight: 850;
    }

    .delta.good {
      color: #0b4f3b;
      background: rgba(20, 124, 86, .15);
    }

    .delta.bad {
      color: #8d2b25;
      background: rgba(201, 65, 58, .14);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.1fr .95fr .95fr;
      gap: 12px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 2px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .panel {
      padding: 16px;
    }

    .panel h2 {
      font-size: 15px;
      letter-spacing: 0;
    }

    .sub {
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .fact {
      min-height: 82px;
      padding: 12px;
      background: rgba(23, 35, 31, .045);
      border: 1px solid rgba(23, 35, 31, .06);
    }

    .fact strong {
      display: block;
      margin-top: 8px;
      font-size: 23px;
      line-height: 1;
    }

    .variance-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .variance-row {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 52px;
      gap: 10px;
      align-items: center;
      min-height: 30px;
    }

    .variance-row b {
      overflow: hidden;
      color: var(--ink);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .axis {
      position: relative;
      height: 12px;
      border-radius: 999px;
      background: rgba(23, 35, 31, .08);
      overflow: hidden;
    }

    .axis::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(23, 35, 31, .28);
    }

    .axis i {
      position: absolute;
      top: 0;
      height: 100%;
      width: var(--w);
      border-radius: inherit;
      background: var(--tone);
    }

    .axis i.pos { left: 50%; }
    .axis i.neg { right: 50%; }

    .axis-scale {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      margin-top: 3px;
      color: var(--muted);
      font: 750 10px/1 var(--mono);
    }

    .axis-scale span:last-child {
      text-align: right;
    }

    .variance-row span {
      color: var(--tone);
      font: 850 12px/1 var(--mono);
      text-align: right;
    }

    .bar-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 62px;
      gap: 10px;
      align-items: center;
      min-height: 30px;
    }

    .bar-row b {
      color: var(--ink);
      font-size: 12px;
    }

    .track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(23, 35, 31, .08);
    }

    .track i {
      display: block;
      width: var(--w);
      height: 100%;
      border-radius: inherit;
      background: var(--tone, var(--teal));
    }

    .bar-row span {
      color: var(--muted);
      font: 800 12px/1 var(--mono);
      text-align: right;
    }

    .risk-scale {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 6px;
      color: var(--muted);
      font: 750 10px/1 var(--mono);
    }

    .risk-scale span:last-child {
      text-align: right;
    }

    .timeline {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .due {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 44px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(23, 35, 31, .09);
    }

    .due:last-child { border-bottom: 0; }

    .date {
      display: grid;
      place-items: center;
      width: 38px;
      height: 32px;
      border-radius: 11px;
      color: #fff9ed;
      background: var(--dark);
      font-size: 12px;
      font-weight: 900;
    }

    .due b {
      display: block;
      font-size: 13px;
    }

    .due span {
      color: var(--muted);
      font-size: 12px;
    }

    .due .money {
      color: var(--red);
      font-size: 13px;
      font-weight: 860;
    }

    .status {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      padding: 10px;
      border-radius: 16px;
      color: #fff9ed;
    }

    .status.good {
      background: linear-gradient(135deg, var(--green), var(--teal));
      box-shadow: 0 16px 36px rgba(20, 124, 86, .18);
    }

    .status.warn {
      background: linear-gradient(135deg, var(--amber), var(--gold));
      box-shadow: 0 16px 36px rgba(216, 145, 43, .18);
    }

    .status.bad {
      background: linear-gradient(135deg, var(--red), #d87942);
      box-shadow: 0 16px 36px rgba(201, 65, 58, .18);
    }

    .status-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .18);
      font-weight: 900;
    }

    .status b {
      display: block;
      font-size: 13px;
    }

    .status span {
      color: rgba(255, 249, 237, .78);
      font-size: 12px;
    }

    .wealth-chart {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .y-axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--muted);
      font: 750 11px/1 var(--mono);
      text-align: right;
    }

    .bars {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      align-items: end;
      gap: 7px;
      height: 116px;
      padding-top: 6px;
      border-bottom: 1px solid rgba(23, 35, 31, .18);
    }

    .bars i {
      height: var(--h);
      min-height: 10px;
      border-radius: 999px 999px 6px 6px;
      background: linear-gradient(180deg, var(--teal), var(--gold));
      box-shadow: 0 10px 22px rgba(17, 122, 104, .18);
    }

    .x-axis {
      grid-column: 2;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font: 750 11px/1 var(--mono);
    }

    .action-card {
      padding: 14px;
      background: var(--paper-solid);
      border: 1px solid var(--line);
    }

    .action-card strong {
      display: block;
      font-size: 24px;
      line-height: 1.05;
    }

    .action-card p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .prototype-switcher {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 46px;
      padding: 6px;
      color: var(--switcher-fg);
      background: var(--switcher-bg);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .38);
      transform: translateX(-50%);
    }

    .prototype-switcher button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      color: inherit;
      background: rgba(255, 255, 255, .12);
      cursor: pointer;
      font-size: 20px;
    }

    .prototype-switcher span {
      min-width: 210px;
      text-align: center;
      font-size: 13px;
      font-weight: 780;
    }

    details.state {
      position: fixed;
      right: 18px;
      bottom: 20px;
      z-index: 25;
      width: min(380px, calc(100vw - 36px));
      max-height: 58vh;
      overflow: auto;
      padding: 10px 12px;
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 252, 245, .9);
      border: 1px solid var(--line);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .18);
    }

    details.state summary {
      cursor: pointer;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    details.state pre {
      margin: 10px 0 0;
      white-space: pre-wrap;
      font: 11px/1.45 var(--mono);
    }

    @media (max-width: 1100px) {
      .screen { padding: 86px 18px 92px; }
      .rail {
        right: 18px;
        bottom: auto;
        width: auto;
        grid-auto-flow: column;
      }
      .focus,
      .focus.wealth,
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .screen { padding: 14px 14px 92px; }
      .top {
        grid-template-columns: 1fr;
      }
      .tabs {
        justify-content: stretch;
      }
      .tab {
        flex: 1;
      }
      .facts {
        grid-template-columns: 1fr;
      }
      .value {
        font-size: 36px;
      }
      .prototype-switcher span { min-width: 150px; }
      details.state { display: none; }
    }
  </style>
</head>
<body>
  <main id="root"></main>

  <script>
    const variants = {
      A: {
        name: "Mesa executiva",
        goal: "Layout equilibrado: tres colunas por pergunta, bom para uso diario."
      },
      B: {
        name: "Scan compacto",
        goal: "Layout mais operacional: a primeira coluna vira checklist de decisao."
      },
      C: {
        name: "Direcao guiada",
        goal: "Layout mais opinativo: destaca a proxima decisao antes dos detalhes."
      }
    };

    const tabLabels = {
      cuts: "Cortes de Gastos",
      wealth: "Patrimonio"
    };

    const topCards = {
      cuts: [
        ["Taxa de poupanca", "50%", "+7 pts vs. media", "good"],
        ["Livre para gastar", "R$ 2.860", "ate fechar o mes", "primary"],
        ["Maior desvio", "+31%", "Restaurantes", "bad"]
      ],
      wealth: [
        ["Patrimonio liquido", "R$ 161.800", "+5,5% no trimestre", "primary"],
        ["Rent. real 12m", "+3,1%", "acima da inflacao", "good"],
        ["Risco carteira", "24/100", "baixo", "good"],
        ["Reserva", "7,2 meses", "acima do minimo", "good"]
      ]
    };

    const sectionsByTab = {
      cuts: ["Gastos", "Cortes", "Agenda"],
      wealth: ["Evolucao", "Carteira", "Agenda"]
    };

    const categoryVariance = [
      ["Mercado", "+18%", "23%", "#c9413a", "pos"],
      ["Restaurantes", "+31%", "39%", "#c9413a", "pos"],
      ["Transporte", "-8%", "10%", "#147c56", "neg"],
      ["Assinaturas", "+6%", "8%", "#d8912b", "pos"]
    ];

    const commitments = [
      ["24", "Fatura Nubank", "fecha em 4 dias", "R$ 3.180"],
      ["28", "Aluguel", "fixo mensal", "R$ 2.450"],
      ["02", "Internet", "recorrente", "R$ 129"]
    ];

    const allocation = [
      ["Reserva", "32%", "55%"],
      ["Renda fixa", "41%", "70%"],
      ["RV/FIIs", "19%", "34%"],
      ["Cripto", "8%", "16%"]
    ];

    const investmentEvents = [
      ["25", "Dividendos MXRF11", "previsto", "R$ 84"],
      ["30", "Aporte automatico", "Tesouro Selic", "R$ 1.200"],
      ["05", "CDB vence", "reaplicar?", "R$ 5.000"]
    ];

    const riskScores = [
      ["Concentr.", "22/100", "22%", "#147c56"],
      ["Inflacao", "48/100", "48%", "#d8912b"],
      ["Liquidez", "18/100", "18%", "#147c56"]
    ];

    const bigExpenses = [
      ["Aluguel", "R$ 2.450", "fixo"],
      ["Mercado Central", "R$ 286", "ok"],
      ["Restaurante", "R$ 214", "rever"],
      ["Farmacia", "R$ 188", "ok"]
    ];

    function currentKey() {
      const param = new URLSearchParams(location.search).get("variant") || "A";
      return variants[param] ? param : "A";
    }

    function currentTab() {
      const param = new URLSearchParams(location.search).get("tab") || "cuts";
      return tabLabels[param] ? param : "cuts";
    }

    function go(nextKey) {
      const url = new URL(location.href);
      url.searchParams.set("variant", nextKey);
      history.replaceState({}, "", url);
      render();
    }

    function setTab(nextTab) {
      const url = new URL(location.href);
      url.searchParams.set("tab", nextTab);
      history.replaceState({}, "", url);
      render();
    }

    function cycle(direction) {
      const keys = Object.keys(variants);
      const index = keys.indexOf(currentKey());
      go(keys[(index + direction + keys.length) % keys.length]);
    }

    function dots() {
      return `<div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>`;
    }

    function rail() {
      return `
        <nav class="rail glass" aria-label="Menu">
          <button class="on">⌂</button><button>◍</button><button>▥</button><button>◇</button><button>↗</button><button>✦</button>
        </nav>
      `;
    }

    function topCard(item) {
      const [label, value, delta, tone] = item;
      const primary = tone === "primary";
      return `
        <article class="hero-card ${primary ? "primary" : "glass"}">
          <div class="label"><span>${label}</span><span>${primary ? "hoje" : "mes"}</span></div>
          <div class="value money">${value}</div>
          <span class="delta ${tone}">${delta}</span>
        </article>
      `;
    }

    function tabs(tab) {
      return `
        <div class="tabs glass" role="tablist" aria-label="Visao do dashboard">
          ${Object.entries(tabLabels).map(([key, label]) => `
            <button class="tab ${tab === key ? "on" : ""}" type="button" role="tab" aria-selected="${tab === key}" onclick="setTab('${key}')">${label}</button>
          `).join("")}
        </div>
      `;
    }

    function categoryPanel(title = "Categorias vs. media 6m") {
      return `
        <article class="panel glass">
          <div class="label"><span>${title}</span><span>desvio</span></div>
          <div class="axis-scale"><span>-40%</span><span>0</span><span>+40%</span></div>
          <div class="variance-list">
            ${categoryVariance.map(row => `
              <div class="variance-row" style="--tone:${row[3]}">
                <b>${row[0]}</b>
                <div class="axis"><i class="${row[4]}" style="--w:${row[2]}"></i></div>
                <span>${row[1]}</span>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function freeMoneyPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Dinheiro livre</span><span>categorias</span></div>
          <div class="bar-list">
            <div class="bar-row" style="--tone:#117a68;--w:72%"><b>Essencial</b><div class="track"><i></i></div><span>R$ 1.480</span></div>
            <div class="bar-row" style="--tone:#edb85f;--w:52%"><b>Lazer</b><div class="track"><i></i></div><span>R$ 620</span></div>
            <div class="bar-row" style="--tone:#c9413a;--w:34%"><b>Restaur.</b><div class="track"><i></i></div><span>R$ 420</span></div>
          </div>
        </article>
      `;
    }

    function costOfLivingPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Custo de vida</span><span>vs 6 meses</span></div>
          <div class="facts">
            <div class="fact"><span class="sub">Este mes</span><strong class="money">R$ 6.184</strong></div>
            <div class="fact"><span class="sub">Media 6m</span><strong class="money">R$ 5.720</strong></div>
          </div>
          <div class="status warn"><span class="status-icon">!</span><div><b>R$ 464 acima da media</b><span>alta concentrada em gastos variaveis</span></div></div>
        </article>
      `;
    }

    function commitmentsPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Proximos compromissos</span><span>10 dias</span></div>
          <div class="timeline">
            ${commitments.map(item => `
              <div class="due">
                <div class="date">${item[0]}</div>
                <div><b>${item[1]}</b><span>${item[2]}</span></div>
                <strong class="money">${item[3]}</strong>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function investmentEventsPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Eventos da carteira</span><span>30 dias</span></div>
          <div class="timeline">
            ${investmentEvents.map(item => `
              <div class="due">
                <div class="date">${item[0]}</div>
                <div><b>${item[1]}</b><span>${item[2]}</span></div>
                <strong class="money">${item[3]}</strong>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function incomePanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Recebi vs. gastei</span><span>ate agora</span></div>
          <div class="facts">
            <div class="fact"><span class="sub">Receitas</span><strong class="money">R$ 12.400</strong></div>
            <div class="fact"><span class="sub">Gastos</span><strong class="money">R$ 6.184</strong></div>
          </div>
          <div class="status good"><span class="status-icon">✓</span><div><b>Metade da renda preservada</b><span>taxa de poupanca acima da meta</span></div></div>
        </article>
      `;
    }

    function wealthPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Patrimonio</span><span>12 meses</span></div>
          <div class="wealth-chart">
            <div class="y-axis"><span>R$ 165k</span><span>R$ 145k</span><span>R$ 125k</span></div>
            <div class="bars">${[32, 38, 35, 48, 54, 59, 63, 68, 74, 79].map(h => `<i style="--h:${h}%"></i>`).join("")}</div>
            <div class="x-axis"><span>set</span><span>dez</span><span>mar</span><span>jun</span></div>
          </div>
          <div class="facts">
            <div class="fact"><span class="sub">Aportes</span><strong class="money">R$ 5.400</strong></div>
            <div class="fact"><span class="sub">Rend. mes</span><strong class="money">R$ 820</strong></div>
          </div>
        </article>
      `;
    }

    function allocationPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Carteira</span><span>alocacao</span></div>
          <div class="bar-list">
            ${allocation.map(item => `
              <div class="bar-row" style="--tone:#117a68;--w:${item[2]}">
                <b>${item[0]}</b><div class="track"><i></i></div><span>${item[1]}</span>
              </div>
            `).join("")}
          </div>
          <div class="status good"><span class="status-icon">✓</span><div><b>Alocacao dentro da meta</b><span>rebalanceamento nao urgente</span></div></div>
        </article>
      `;
    }

    function bigExpensesPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Maiores gastos</span><span>mes</span></div>
          <div class="timeline">
            ${bigExpenses.map((item, index) => `
              <div class="due">
                <div class="date">${index + 1}</div>
                <div><b>${item[0]}</b><span>${item[2]}</span></div>
                <strong class="money">${item[1]}</strong>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function recurringPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Assinaturas</span><span>vazamento</span></div>
          <div class="facts">
            <div class="fact"><span class="sub">Recorrente</span><strong class="money">R$ 684</strong></div>
            <div class="fact"><span class="sub">Suspeito</span><strong class="money">R$ 129</strong></div>
          </div>
          <div class="status warn"><span class="status-icon">!</span><div><b>2 itens sem uso recente</b><span>revisar antes da proxima cobranca</span></div></div>
        </article>
      `;
    }

    function riskPanel() {
      return `
        <article class="panel glass">
          <div class="label"><span>Riscos da carteira</span><span>0 baixo / 100 alto</span></div>
          <div class="bar-list">
            ${riskScores.map(item => `
              <div class="bar-row" style="--tone:${item[3]};--w:${item[2]}">
                <b>${item[0]}</b><div class="track"><i></i></div><span>${item[1]}</span>
              </div>
            `).join("")}
          </div>
          <div class="risk-scale"><span>0</span><span>100</span></div>
          <div class="status good"><span class="status-icon">✓</span><div><b>Sem concentracao critica</b><span>maior ativo em 11% da carteira</span></div></div>
        </article>
      `;
    }

    function actionPanel(copy) {
      return `
        <article class="action-card">
          <strong>${copy.title}</strong>
          <p>${copy.body}</p>
        </article>
      `;
    }

    function columnsFor(key, tab) {
      if (tab === "wealth") {
        if (key === "B") {
          return [
            [actionPanel({ title: "Evolucao patrimonial", body: "Separar aporte de rentabilidade deixa claro se o patrimonio cresceu por disciplina ou mercado." }), wealthPanel()],
            [allocationPanel(), riskPanel()],
            [investmentEventsPanel()]
          ];
        }

        if (key === "C") {
          return [
            [wealthPanel()],
            [actionPanel({ title: "Carteira dentro da rota", body: "Alocacao e risco seguem aceitaveis; proxima revisao e inflacao da renda fixa." }), allocationPanel(), riskPanel()],
            [investmentEventsPanel()]
          ];
        }

        return [
          [wealthPanel()],
          [allocationPanel(), riskPanel()],
          [investmentEventsPanel(), actionPanel({ title: "Agenda sem urgencia", body: "Proximo evento relevante e o aporte automatico. Sem vencimento critico nesta semana." })]
        ];
      }

      if (key === "B") {
        return [
          [categoryPanel("Onde mais subiu"), bigExpensesPanel()],
          [actionPanel({ title: "Atacar restaurantes primeiro", body: "+31% contra a media, mas ainda e uma categoria flexivel." }), costOfLivingPanel(), recurringPanel()],
          [freeMoneyPanel(), commitmentsPanel()]
        ];
      }

      if (key === "C") {
        return [
          [actionPanel({ title: "Cortar R$ 420 agora", body: "Restaurantes e assinaturas entregam o maior retorno sem tocar nos gastos fixos." }), categoryPanel("Onde mais subiu"), bigExpensesPanel()],
          [costOfLivingPanel(), recurringPanel()],
          [freeMoneyPanel(), commitmentsPanel()]
        ];
      }

      return [
        [categoryPanel("Onde mais subiu"), bigExpensesPanel()],
        [costOfLivingPanel(), recurringPanel()],
        [freeMoneyPanel(), commitmentsPanel()]
      ];
    }

    function renderDashboard(key, tab) {
      const variant = variants[key];
      const columns = columnsFor(key, tab);
      const sections = sectionsByTab[tab];
      return `
        <section class="screen">
          ${rail()}
          <div class="shell">
            <header class="top">
              <div class="brand">${dots()}<h1>${variant.name}</h1></div>
              ${tabs(tab)}
            </header>

            <section class="focus ${tab}">
              ${topCards[tab].map(topCard).join("")}
            </section>

            <section class="main-grid">
              ${columns.map((items, index) => `
                <div class="stack">
                  <div class="section-title"><span>${sections[index]}</span><span>${index + 1}/3</span></div>
                  ${items.join("")}
                </div>
              `).join("")}
            </section>
          </div>
        </section>
      `;
    }

    function switcher(key) {
      return `
        <div class="prototype-switcher" role="group" aria-label="Alternar variante">
          <button type="button" aria-label="Anterior" onclick="cycle(-1)">‹</button>
          <span>${key} - ${variants[key].name}</span>
          <button type="button" aria-label="Proxima" onclick="cycle(1)">›</button>
        </div>
      `;
    }

    function state(key) {
      const tab = currentTab();
      return `
        <details class="state">
          <summary>Estado</summary>
          <pre>${JSON.stringify({ current: key, tab, variant: variants[key], categoryVariance, commitments, investmentEvents, allocation, riskScores }, null, 2)}</pre>
        </details>
      `;
    }

    function render() {
      const key = currentKey();
      const tab = currentTab();
      document.getElementById("root").innerHTML = `${renderDashboard(key, tab)}${switcher(key)}${state(key)}`;
    }

    addEventListener("keydown", event => {
      const target = event.target;
      const tag = target && target.tagName ? target.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || target.isContentEditable) return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });

    render();
  </script>
</body>
</html>
