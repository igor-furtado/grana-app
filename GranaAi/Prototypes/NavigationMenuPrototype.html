<!doctype html>
<!--
PROTOTYPE - descartavel.
Question: Final navigation shell direction for GranaAi: compact side rail with icons only, using the warm/teal theme background.
Run by opening this file in a browser.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grana AI - Navigation Menu Prototype</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f4f0e8;
      --ink: #17231f;
      --muted: rgba(23, 35, 31, .62);
      --soft: rgba(23, 35, 31, .07);
      --line: rgba(23, 35, 31, .13);
      --paper: rgba(255, 252, 245, .76);
      --paper-strong: rgba(255, 252, 245, .9);
      --teal: #117a68;
      --teal-2: #0c5f53;
      --gold: #edb85f;
      --dark: #17231f;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, monospace;
      --shadow: 0 22px 72px rgba(41, 33, 22, .14);
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: var(--font);
      letter-spacing: 0;
      background:
        radial-gradient(circle at 8% 8%, rgba(237, 184, 95, .34), transparent 24%),
        radial-gradient(circle at 88% 0%, rgba(17, 122, 104, .26), transparent 25%),
        linear-gradient(135deg, #f8f3e8, #edf4ef);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(23, 35, 31, .025) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 35, 31, .02) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: .7;
    }

    button { font: inherit; }
    h1, h2, p { margin: 0; }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    .titlebar {
      height: 62px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      background: rgba(255, 255, 255, .58);
      border-bottom: 1px solid rgba(23, 35, 31, .08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .dots {
      display: flex;
      gap: 12px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1);
    }

    .red { background: #ff5f57; }
    .yellow { background: #febc2e; }
    .green { background: #28c840; }

    .brand {
      color: rgba(23, 35, 31, .74);
      font-size: 25px;
      font-weight: 880;
    }

    .ambient {
      position: absolute;
      inset: 62px 0 0;
      pointer-events: none;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(3px);
      opacity: .36;
    }

    .ambient::before {
      width: 360px;
      height: 360px;
      right: 13%;
      top: 13%;
      background: rgba(17, 122, 104, .16);
    }

    .ambient::after {
      width: 300px;
      height: 300px;
      left: 22%;
      bottom: 14%;
      background: rgba(237, 184, 95, .18);
    }

    .empty-canvas {
      min-height: calc(100vh - 62px);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .ghost-label {
      color: rgba(23, 35, 31, .17);
      font-size: clamp(46px, 8vw, 104px);
      font-weight: 900;
      line-height: .9;
      user-select: none;
    }

    .glass {
      border: 1px solid var(--line);
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(132%);
      -webkit-backdrop-filter: blur(26px) saturate(132%);
    }

    .icon {
      width: 20px;
      height: 20px;
      display: block;
      flex: 0 0 auto;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .item {
      border: 0;
      color: rgba(23, 35, 31, .62);
      background: transparent;
      cursor: pointer;
      font-weight: 800;
    }

    .item.active {
      color: #fff9ed;
      background: linear-gradient(135deg, var(--dark), var(--teal));
      box-shadow: 0 16px 34px rgba(17, 122, 104, .22);
    }

    .section-label {
      color: rgba(23, 35, 31, .42);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .rail-variant {
      position: fixed;
      left: 18px;
      top: 82px;
      bottom: 18px;
      z-index: 5;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 14px;
      width: 70px;
      padding: 10px;
      border-radius: 27px;
    }

    .rail-stack,
    .rail-bottom {
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .rail-stack {
      align-content: start;
    }

    .rail-variant .item {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 18px;
    }

    .sidebar-variant {
      position: fixed;
      left: 18px;
      top: 82px;
      bottom: 18px;
      z-index: 5;
      width: 286px;
      padding: 16px;
      border-radius: 30px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
    }

    .sidebar-title {
      display: grid;
      gap: 2px;
    }

    .sidebar-title strong {
      font-size: 18px;
      font-weight: 900;
    }

    .sidebar-title span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .round-action {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 15px;
      color: #fff9ed;
      background: var(--dark);
      cursor: pointer;
      font-size: 20px;
      font-weight: 900;
    }

    .sidebar-groups {
      display: grid;
      align-content: start;
      gap: 18px;
      overflow: hidden;
    }

    .sidebar-group {
      display: grid;
      gap: 7px;
    }

    .sidebar-variant .item {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 15px;
      text-align: left;
      font-size: 14px;
    }

    .sidebar-variant .item.active {
      color: var(--dark);
      background: rgba(237, 184, 95, .42);
      box-shadow: none;
    }

    .sidebar-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 9px;
      border-radius: 19px;
      background: rgba(23, 35, 31, .06);
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #fff9ed;
      background: var(--teal);
      font-size: 12px;
      font-weight: 900;
    }

    .dock-variant {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 5;
      display: flex;
      align-items: end;
      gap: 8px;
      min-height: 72px;
      padding: 10px;
      border-radius: 29px;
      transform: translateX(-50%);
    }

    .dock-variant .item {
      position: relative;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 5px;
      width: 62px;
      height: 52px;
      border-radius: 19px;
    }

    .dock-variant .item span:last-child {
      max-width: 58px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
      font-weight: 850;
    }

    .dock-variant .item.active {
      width: 116px;
      color: #fff9ed;
      border-radius: 21px;
    }

    .dock-variant .item.active span:last-child {
      max-width: 92px;
      font-size: 12px;
    }

    .dock-more {
      width: 40px;
      height: 52px;
      border: 0;
      border-radius: 18px;
      color: rgba(23, 35, 31, .56);
      background: rgba(23, 35, 31, .06);
      cursor: pointer;
      font-size: 18px;
      font-weight: 900;
    }

    .hybrid-rail {
      position: fixed;
      left: 18px;
      top: 82px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 24px;
      writing-mode: vertical-rl;
    }

    .hybrid-rail .item {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 16px;
      writing-mode: horizontal-tb;
    }

    .hybrid-dock {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      transform: translateX(-50%);
    }

    .hybrid-dock .item {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 122px;
      height: 48px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 13px;
    }

    .prototype-switcher {
      position: fixed;
      left: 50%;
      bottom: 110px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 46px;
      padding: 6px;
      color: #fff9ed;
      background: #101915;
      border: 1px solid rgba(255, 249, 237, .18);
      border-radius: 999px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .34);
      transform: translateX(-50%);
    }

    .prototype-switcher button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      color: inherit;
      background: rgba(255, 249, 237, .12);
      cursor: pointer;
      font-size: 20px;
    }

    .prototype-switcher span {
      min-width: 246px;
      text-align: center;
      font-size: 13px;
      font-weight: 820;
    }

    details.state {
      position: fixed;
      right: 18px;
      bottom: 20px;
      z-index: 20;
      max-width: 380px;
      padding: 12px 14px;
      border-radius: 16px;
      color: var(--ink);
      background: rgba(255, 250, 240, .9);
      border: 1px solid rgba(23, 35, 31, .12);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .18);
    }

    details.state summary {
      cursor: pointer;
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
    }

    details.state pre {
      margin: 10px 0 0;
      white-space: pre-wrap;
      font: 11px/1.45 var(--mono);
    }

    @media (max-width: 820px) {
      .sidebar-variant {
        width: min(286px, calc(100vw - 36px));
      }

      .ghost-label {
        opacity: 0;
      }

      .prototype-switcher {
        bottom: 104px;
      }

      .prototype-switcher span {
        min-width: 180px;
      }

      details.state {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main id="root"></main>

  <script>
    const selectedDirection = {
      name: "Rail compacto",
      model: "Menu lateral icon-only, sempre presente, sem logo no topo."
    };

    const groups = [
      { title: null, items: [
        ["dashboard", "Dashboard", "pie"],
        ["transactions", "Transações", "list"],
        ["creditCards", "Cartões", "card"],
        ["accounts", "Contas", "bank"]
      ] },
      { title: "Facilidades", items: [
        ["import", "Importar", "import"],
        ["categorization", "Categorizar", "spark"]
      ] },
      { title: "Ajustes", items: [
        ["categories", "Categorias", "tag"],
        ["institutions", "Instituições", "bank"],
        ["profile", "Perfil", "user"]
      ] }
    ];

    const primary = groups[0].items;
    const activeId = "dashboard";

    function icon(name) {
      const paths = {
        pie: '<path d="M12 3v9l7 4"/><path d="M21 12a9 9 0 1 1-9-9"/>',
        doc: '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h7"/>',
        list: '<path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
        card: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',
        bank: '<path d="M4 10h16L12 4z"/><path d="M6 10v8M10 10v8M14 10v8M18 10v8M4 20h16"/>',
        target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/>',
        vault: '<path d="M4 12h16l-4-6-4 6-3-4z"/><path d="M6 16h12"/>',
        trend: '<path d="M4 18V6"/><path d="M4 18h16"/><path d="M7 15l4-4 3 3 5-7"/><path d="M16 7h3v3"/>',
        import: '<path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/>',
        spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z"/>',
        tag: '<path d="M4 12V5h7l9 9-7 7z"/><path d="M8 8h.01"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
        wrench: '<path d="M14 6a5 5 0 0 0 6 6l-8 8a3 3 0 0 1-4-4z"/>',
        more: '<path d="M6 12h.01M12 12h.01M18 12h.01"/>'
      };
      return `<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg></span>`;
    }

    function item([id, label, iconName], options = {}) {
      const isActive = id === activeId;
      const text = options.text === false ? "" : `<span>${label}</span>`;
      const title = ` title="${label}"`;
      return `<button class="item ${isActive ? "active" : ""}" type="button"${title}>${icon(iconName)}${text}</button>`;
    }

    function dots() {
      return `<div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>`;
    }

    function titlebar() {
      return `
        <header class="titlebar">
          ${dots()}
          <div class="brand">GranaAi</div>
        </header>
      `;
    }

    function base() {
      return `
        ${titlebar()}
        <div class="ambient"></div>
        <section class="empty-canvas" aria-hidden="true">
          <h1 class="ghost-label">GranaAi</h1>
        </section>
      `;
    }

    function variantA() {
      return `
        <nav class="rail-variant glass" aria-label="Navegação principal">
          <div class="rail-stack">${primary.map(section => item(section, { text: false })).join("")}</div>
          <div class="rail-bottom">
            ${item(["profile", "Perfil", "user"], { text: false })}
          </div>
        </nav>
      `;
    }

    function variantB() {
      return `
        <nav class="sidebar-variant glass" aria-label="Navegação principal">
          <div class="sidebar-head">
            <div class="sidebar-title">
              <strong>GranaAi</strong>
              <span>Finanças pessoais</span>
            </div>
            <button class="round-action" type="button" aria-label="Nova transação">+</button>
          </div>
          <div class="sidebar-groups">
            ${groups.map(group => `
              <section class="sidebar-group">
                ${group.title ? `<div class="section-label">${group.title}</div>` : ""}
                ${group.items.map(section => item(section)).join("")}
              </section>
            `).join("")}
          </div>
          <div class="sidebar-foot">
            <span class="avatar">FT</span>
            <div class="sidebar-title">
              <strong>Furtadino</strong>
              <span>Conta conectada</span>
            </div>
          </div>
        </nav>
      `;
    }

    function variantC() {
      return `
        <nav class="dock-variant glass" aria-label="Navegação principal">
          ${primary.map(section => item(section)).join("")}
          <button class="dock-more" type="button" title="Mais">${icon("more")}</button>
        </nav>
      `;
    }

    function variantD() {
      return `
        <nav class="hybrid-rail glass" aria-label="Atalhos auxiliares">
          ${economy.concat(groups[2].items, groups[3].items.slice(0, 2)).map(section => item(section, { text: false })).join("")}
        </nav>
        <nav class="hybrid-dock glass" aria-label="Navegação principal">
          ${primary.map(section => item(section)).join("")}
        </nav>
      `;
    }

    function state() {
      return `
        <details class="state">
          <summary>Estado</summary>
          <pre>${JSON.stringify({ selected: "A", direction: selectedDirection, activeId }, null, 2)}</pre>
        </details>
      `;
    }

    function render() {
      document.getElementById("root").innerHTML = `<section class="stage">${base()}${variantA()}${state()}</section>`;
    }

    render();
  </script>
</body>
</html>
