<!doctype html>
<!--
PROTOTYPE - descartavel.
Question: Final EmptyStateView-style replacement for the global "Grana AI indisponivel" state, using the dashboard warm/teal design system.
Run by opening this file in a browser.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grana AI - Empty State Prototype</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f4f0e8;
      --ink: #17231f;
      --muted: rgba(23, 35, 31, .62);
      --line: rgba(23, 35, 31, .13);
      --teal: #117a68;
      --gold: #edb85f;
      --dark: #17231f;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font);
      letter-spacing: 0;
      background:
        radial-gradient(circle at 8% 8%, rgba(237, 184, 95, .24), transparent 24%),
        radial-gradient(circle at 88% 0%, rgba(17, 122, 104, .18), transparent 25%),
        linear-gradient(135deg, #f8f3e8, #edf4ef);
    }

    button { font: inherit; }
    h1, p { margin: 0; }

    .titlebar {
      height: 62px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      background: rgba(255, 255, 255, .72);
      border-bottom: 1px solid rgba(23, 35, 31, .08);
      backdrop-filter: blur(20px);
    }

    .dots {
      display: flex;
      gap: 12px;
    }

    .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1);
    }

    .red { background: #ff5f57; }
    .yellow { background: #febc2e; }
    .green { background: #28c840; }

    .app-name {
      color: rgba(23, 35, 31, .74);
      font-size: 27px;
      font-weight: 880;
    }

    .canvas {
      min-height: calc(100vh - 62px);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .empty-state {
      width: min(620px, 100%);
      display: grid;
      justify-items: center;
      text-align: center;
    }

    .icon {
      display: grid;
      place-items: center;
      color: var(--dark);
    }

    .icon svg {
      width: var(--icon-size);
      height: var(--icon-size);
      filter: drop-shadow(0 18px 30px rgba(17, 122, 104, .14));
    }

    .empty-state .icon {
      --icon-size: 62px;
      margin-bottom: 22px;
    }

    h1 {
      max-width: 560px;
      font-size: 48px;
      line-height: 1.04;
      font-weight: 860;
    }

    .description {
      max-width: 560px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.42;
      font-weight: 680;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    .primary,
    .secondary {
      min-height: 48px;
      border: 0;
      border-radius: 15px;
      padding: 0 20px;
      cursor: pointer;
      font-weight: 860;
    }

    .primary {
      color: #fff9ed;
      background: linear-gradient(135deg, var(--dark), var(--teal));
      box-shadow: 0 16px 34px rgba(17, 122, 104, .22);
    }

    .secondary {
      color: var(--ink);
      background: rgba(23, 35, 31, .07);
    }

    @media (max-width: 720px) {
      .dot {
        width: 18px;
        height: 18px;
      }

      .app-name {
        font-size: 22px;
      }

      h1 {
        font-size: 34px;
      }

      .description {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <main id="root"></main>

  <script>
    const content = {
      title: "Grana AI indisponivel",
      description: "Nao foi possivel falar com o backend agora. Tente novamente para validar a sessao e carregar os dados financeiros.",
      action: "Tentar novamente",
      secondary: "Detalhes"
    };

    function dots() {
      return `<div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>`;
    }

    function titlebar() {
      return `
        <header class="titlebar">
          ${dots()}
          <div class="app-name">GranaAi</div>
        </header>
      `;
    }

    function icon() {
      return `
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M32 8a24 24 0 1 0 21 12" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
            <path d="M32 8v24l19-12" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M32 32l18 18" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
          </svg>
        </div>
      `;
    }

    function actions() {
      return `
        <div class="actions">
          <button class="primary" type="button">${content.action}</button>
          <button class="secondary" type="button">${content.secondary}</button>
        </div>
      `;
    }

    function emptyState() {
      return `
        <section class="empty-state">
          ${icon()}
          <h1>${content.title}</h1>
          <p class="description">${content.description}</p>
          ${actions()}
        </section>
      `;
    }

    function render() {
      document.getElementById("root").innerHTML = `${titlebar()}<section class="canvas">${emptyState()}</section>`;
    }

    render();
  </script>
</body>
</html>
