config:
  edition: 3

streams:
  user_financial_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM profiles WHERE id = auth.user_id()
      - SELECT * FROM accounts WHERE user_id = auth.user_id()
      - SELECT * FROM bank_accounts WHERE user_id = auth.user_id()
      - SELECT * FROM credit_cards WHERE user_id = auth.user_id()
      - SELECT * FROM credit_card_cycle_configs WHERE user_id = auth.user_id()
      - SELECT * FROM statements WHERE user_id = auth.user_id()
      - SELECT * FROM import_batches WHERE user_id = auth.user_id()
      - SELECT * FROM transactions WHERE user_id = auth.user_id()
      - SELECT * FROM statement_payments WHERE user_id = auth.user_id()
      - SELECT * FROM statement_credit_applications WHERE user_id = auth.user_id()
      - SELECT * FROM categorization_cache WHERE user_id = auth.user_id()
      - SELECT * FROM categorization_corrections WHERE user_id = auth.user_id()
