<!doctype html>
<!--
PROTOTYPE - descartavel.
Verdict: Variant B won. Single centered split card, Apple first, email as fallback,
explicit linking only when prompted.
Run by opening this file in a browser.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GranaApp - Login Prototype</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --ink: #17231f;
      --muted: rgba(23, 35, 31, .58);
      --line: rgba(23, 35, 31, .13);
      --paper: rgba(255, 255, 255, .86);
      --teal: #117a68;
      --teal-deep: #0c5f53;
      --cream: #fff8ea;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, monospace;
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font);
      letter-spacing: 0;
      background:
        linear-gradient(135deg, rgba(248, 243, 232, .98), rgba(237, 244, 239, .98)),
        linear-gradient(120deg, rgba(237, 184, 95, .16), transparent 42%),
        linear-gradient(300deg, rgba(17, 122, 104, .16), transparent 44%);
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    h1,
    p {
      margin: 0;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 62px 1fr;
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(23, 35, 31, .08);
      background: rgba(255, 255, 255, .50);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .dots {
      display: flex;
      gap: 12px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1);
    }

    .red { background: #ff5f57; }
    .yellow { background: #febc2e; }
    .green { background: #28c840; }

    .brand {
      color: rgba(23, 35, 31, .76);
      font-size: 24px;
      font-weight: 860;
    }

    .canvas {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 36px 24px 92px;
    }

    .login-panel {
      width: min(980px, 100%);
      min-height: 480px;
      display: grid;
      grid-template-columns: minmax(0, .9fr) 1px minmax(0, 1fr);
      gap: 42px;
      align-items: center;
      padding: 56px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 22px 64px rgba(48, 38, 24, .13);
      backdrop-filter: blur(24px) saturate(130%);
      -webkit-backdrop-filter: blur(24px) saturate(130%);
    }

    .brand-side {
      display: grid;
      gap: 24px;
      justify-items: center;
      text-align: center;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      color: var(--cream);
      background: linear-gradient(135deg, var(--ink), var(--teal));
      font-size: 24px;
      font-weight: 900;
    }

    .brand-side h1 {
      font-size: 30px;
      line-height: 1.05;
      font-weight: 880;
    }

    .brand-side p {
      max-width: 230px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 650;
    }

    .divider {
      width: 1px;
      min-height: 260px;
      background: rgba(23, 35, 31, .16);
    }

    .form-side {
      display: grid;
      gap: 22px;
      width: min(390px, 100%);
      justify-self: center;
    }

    .copy {
      display: grid;
      gap: 8px;
    }

    .copy h1 {
      font-size: 34px;
      line-height: 1.02;
      font-weight: 880;
    }

    .copy p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
      font-weight: 650;
    }

    .apple {
      min-height: 54px;
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 0 18px;
      color: var(--cream);
      background: linear-gradient(135deg, var(--ink), var(--teal));
      box-shadow: 0 16px 34px rgba(17, 122, 104, .20);
      font-size: 16px;
      font-weight: 840;
    }

    .or-divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      color: rgba(23, 35, 31, .42);
      font-size: 12px;
      font-weight: 760;
      text-transform: uppercase;
    }

    .or-divider::before,
    .or-divider::after {
      content: "";
      height: 1px;
      background: rgba(23, 35, 31, .12);
    }

    .email-link {
      min-height: 44px;
      border: 0;
      color: var(--teal-deep);
      background: transparent;
      font-size: 15px;
      font-weight: 760;
    }

    .email-form {
      display: grid;
      gap: 10px;
    }

    .email-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    input {
      min-width: 0;
      height: 48px;
      border: 1px solid rgba(23, 35, 31, .14);
      border-radius: 14px;
      padding: 0 14px;
      color: var(--ink);
      background: rgba(255, 252, 245, .88);
      outline: none;
      font-size: 15px;
      font-weight: 650;
    }

    input:focus {
      border-color: rgba(17, 122, 104, .52);
      box-shadow: 0 0 0 4px rgba(17, 122, 104, .11);
    }

    .email-form button,
    .link-box button,
    .dev-actions button {
      min-height: 40px;
      border: 0;
      border-radius: 13px;
      padding: 0 14px;
      color: var(--teal-deep);
      background: rgba(17, 122, 104, .10);
      font-weight: 780;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .link-box {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(199, 138, 40, .25);
      background: rgba(199, 138, 40, .10);
    }

    .link-box strong {
      font-size: 14px;
    }

    .link-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .link-actions .confirm {
      color: var(--cream);
      background: var(--teal-deep);
    }

    .dev-actions {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 20;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dev-actions button {
      min-height: 34px;
      color: rgba(23, 35, 31, .72);
      background: rgba(255, 250, 240, .78);
      border: 1px solid rgba(23, 35, 31, .10);
      font-size: 12px;
    }

    details.state {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      width: min(300px, calc(100vw - 36px));
      padding: 10px 12px;
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 250, 240, .86);
      border: 1px solid rgba(23, 35, 31, .12);
      box-shadow: 0 14px 34px rgba(0, 0, 0, .14);
    }

    details.state summary {
      cursor: pointer;
      font-size: 11px;
      font-weight: 820;
      text-transform: uppercase;
    }

    details.state pre {
      margin: 10px 0 0;
      white-space: pre-wrap;
      font: 11px/1.45 var(--mono);
    }

    @media (max-width: 820px) {
      body { overflow: auto; }

      .canvas {
        min-height: auto;
        padding-bottom: 96px;
      }

      .login-panel,
      .email-row {
        grid-template-columns: 1fr;
      }

      .divider {
        width: 100%;
        min-height: 1px;
      }

      .dev-actions,
      details.state {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main id="root"></main>

  <script>
    const state = {
      email: "",
      phase: "idle",
      method: null,
      link: false
    };

    function updateEmail(value) {
      state.email = value.trim();
      state.phase = "email";
      render();
      const input = document.querySelector("[data-email]");
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function useApple() {
      state.method = "apple";
      state.phase = "apple";
      state.link = false;
      render();
    }

    function chooseEmail() {
      state.method = "email_otp";
      state.phase = "email";
      state.link = false;
      render();
    }

    function enterWithEmail() {
      state.method = "email_otp";
      state.phase = state.email ? "sent" : "missing_email";
      state.link = false;
      render();
    }

    function askLink(method) {
      state.method = method;
      state.phase = "link";
      state.link = true;
      render();
    }

    function confirmLink() {
      state.phase = "linked";
      state.link = false;
      render();
    }

    function resetState() {
      state.email = "";
      state.phase = "idle";
      state.method = null;
      state.link = false;
      render();
    }

    function statusText() {
      switch (state.phase) {
        case "apple": return "Abrindo Apple...";
        case "sent": return "Codigo enviado.";
        case "missing_email": return "Informe o email.";
        case "link": return "Confirme a vinculacao.";
        case "linked": return "Metodos vinculados.";
        default: return "";
      }
    }

    function emailValue() {
      return state.email
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;");
    }

    function titlebar() {
      return `
        <header class="titlebar">
          <div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
          <div class="brand">GranaApp</div>
        </header>
      `;
    }

    function logo() {
      return '<div class="logo" aria-hidden="true">G</div>';
    }

    function emailForm() {
      if (state.method !== "email_otp" && state.phase !== "missing_email" && state.phase !== "sent") {
        return '<button class="email-link" type="button" onclick="chooseEmail()">Entrar com email</button>';
      }
      return `
        <section class="email-form">
          <div class="email-row">
            <input data-email type="email" value="${emailValue()}" placeholder="email@exemplo.com" oninput="updateEmail(this.value)">
            <button type="button" onclick="enterWithEmail()">Entrar</button>
          </div>
          <p class="status">${statusText()}</p>
        </section>
      `;
    }

    function linkPrompt() {
      if (!state.link) return "";
      return `
        <section class="link-box">
          <strong>Vincular Apple e email?</strong>
          <div class="link-actions">
            <button class="confirm" type="button" onclick="confirmLink()">Vincular</button>
            <button type="button" onclick="resetState()">Agora nao</button>
          </div>
        </section>
      `;
    }

    function devActions() {
      return `
        <div class="dev-actions" aria-label="Acoes de prototipo">
          <button type="button" onclick="askLink('apple')">link Apple</button>
          <button type="button" onclick="askLink('email_otp')">link email</button>
          <button type="button" onclick="resetState()">reset</button>
        </div>
      `;
    }

    function statePanel() {
      return `
        <details class="state">
          <summary>Estado</summary>
          <pre>${JSON.stringify(state, null, 2)}</pre>
        </details>
      `;
    }

    function login() {
      return `
        <section class="login-panel">
          <div class="brand-side">
            ${logo()}
            <div>
              <h1>GranaApp</h1>
              <p>Seu painel financeiro pessoal.</p>
            </div>
          </div>

          <div class="divider" aria-hidden="true"></div>

          <div class="form-side">
            <div class="copy">
              <h1>Entrar</h1>
              <p>Escolha um metodo.</p>
            </div>
            <button class="apple" type="button" onclick="useApple()">Continuar com Apple</button>
            <div class="or-divider">ou</div>
            ${emailForm()}
            ${linkPrompt()}
          </div>
        </section>
      `;
    }

    function render() {
      document.getElementById("root").innerHTML =
        `<section class="stage">${titlebar()}<section class="canvas">${login()}</section>${devActions()}${statePanel()}</section>`;
    }

    addEventListener("keydown", event => {
      const target = event.target;
      const tag = target && target.tagName ? target.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || target.isContentEditable) return;
      if (event.key === "r" || event.key === "R") resetState();
    });

    render();
  </script>
</body>
</html>
