<!doctype html>
<!--
PROTOTYPE - descartavel.
Question: One compact guided-timeline redesign for the CSV review step, with the wizard moved into a lateral navigation timeline, using the GranaApp theme.
Run by opening this file in a browser.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GranaApp - Import Wizard Guided Timeline Prototype</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --ink: #17231f;
      --muted: rgba(23, 35, 31, .62);
      --line: rgba(23, 35, 31, .11);
      --paper: rgba(255, 252, 245, .78);
      --paper-solid: #fffaf0;
      --soft: rgba(23, 35, 31, .05);
      --teal: #117a68;
      --teal-deep: #0c5f53;
      --green: #147c56;
      --red: #c9413a;
      --gold: #edb85f;
      --shadow-lg: 0 26px 72px rgba(41, 33, 22, .14);
      --shadow-md: 0 18px 40px rgba(41, 33, 22, .09);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, monospace;
      color-scheme: light;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 4% 0%, rgba(237, 184, 95, .36), transparent 22%),
        radial-gradient(circle at 100% 0%, rgba(17, 122, 104, .22), transparent 28%),
        linear-gradient(135deg, #f8f3e8, #edf4ef);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(23, 35, 31, .018) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 35, 31, .018) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: .5;
    }

    h1, h2, h3, h4, p, pre { margin: 0; }
    button, select { font: inherit; }

    .money {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 24px 24px 132px;
    }

    .stage {
      max-width: 1600px;
      margin: 0 auto;
    }

    .window {
      padding: 18px;
      border-radius: 36px;
      background: rgba(255, 252, 245, .46);
      border: 1px solid rgba(255, 255, 255, .55);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(24px) saturate(120%);
      -webkit-backdrop-filter: blur(24px) saturate(120%);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 10px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #28c840; }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .title {
      font-size: 30px;
      font-weight: 860;
      line-height: 1.02;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      max-width: 820px;
    }

    .pill-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      min-height: 34px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: rgba(255, 250, 240, .9);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      font-size: 13px;
      font-weight: 720;
    }

    .page {
      display: grid;
      gap: 16px;
    }

    .surface {
      border-radius: var(--radius-lg);
      background: var(--paper-solid);
      border: 1px solid rgba(23, 35, 31, .07);
      box-shadow: var(--shadow-md);
    }

    .panel {
      padding: 18px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .panel-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .panel h2 {
      font-size: 18px;
      line-height: 1.1;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .transactions-shell {
      display: grid;
      gap: 14px;
    }

    .segmented-list {
      display: grid;
      gap: 12px;
    }

    .group {
      border-radius: 20px;
      overflow: hidden;
      background: rgba(23, 35, 31, .08);
    }

    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 54px;
      padding: 0 16px;
      background: rgba(255, 252, 245, .92);
      border-bottom: 1px solid rgba(23, 35, 31, .07);
    }

    .group-title {
      font-size: 15px;
      font-weight: 820;
    }

    .row {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      min-height: 82px;
      padding: 0 16px;
      background: var(--paper-solid);
      border-bottom: 1px solid rgba(23, 35, 31, .06);
    }

    .row:last-child { border-bottom: 0; }

    .check {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #fffaf0;
      background: var(--teal);
      font-size: 15px;
      font-weight: 900;
    }

    .check.off {
      background: rgba(201, 65, 58, .16);
      color: var(--red);
    }

    .bank {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff8a27, #ff6f0f);
      color: white;
      font-size: 13px;
      font-weight: 860;
    }

    .desc strong {
      display: block;
      font-size: 17px;
      font-weight: 760;
      line-height: 1.2;
    }

    .desc span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .amount {
      text-align: right;
    }

    .amount strong {
      display: block;
      font-size: 20px;
    }

    .amount span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .timeline-panel {
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      gap: 14px;
      min-height: 100%;
    }

    .timeline {
      display: grid;
      gap: 12px;
      position: relative;
      padding-left: 28px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: linear-gradient(180deg, rgba(17, 122, 104, .28), rgba(23, 35, 31, .08));
    }

    .timeline-item {
      position: relative;
      padding: 16px 16px 16px 18px;
      border-radius: 18px;
      background: rgba(255, 252, 245, .94);
      border: 1px solid rgba(23, 35, 31, .07);
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 22px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 5px rgba(17, 122, 104, .12);
    }

    .timeline-item.current::before {
      background: var(--gold);
      box-shadow: 0 0 0 5px rgba(237, 184, 95, .18);
    }

    .timeline-item.done::before {
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(20, 124, 86, .15);
    }

    .timeline-item h3 {
      font-size: 15px;
      line-height: 1.2;
      margin-top: 4px;
    }

    .timeline-item p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin-top: 6px;
    }

    .timeline-item .micro {
      display: block;
      margin-top: 8px;
      color: var(--teal-deep);
      font-size: 12px;
      font-weight: 760;
    }

    .nav-caption {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(17, 122, 104, .08);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .account-card {
      display: grid;
      gap: 12px;
    }

    .account-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      background: var(--soft);
      border: 1px solid rgba(23, 35, 31, .05);
    }

    .account-name {
      font-size: 16px;
      font-weight: 780;
    }

    .select-chip {
      min-width: 300px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(23, 35, 31, .08);
      background: #f2ece1;
      font-size: 15px;
      font-weight: 760;
      text-align: left;
    }

    .sidebar-actions {
      display: grid;
      gap: 12px;
      align-content: end;
      margin-top: auto;
      padding-top: 6px;
    }

    .cta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 22px;
      background: rgba(255, 252, 245, .94);
      border: 1px solid rgba(23, 35, 31, .08);
      box-shadow: var(--shadow-md);
    }

    .button-row {
      display: flex;
      gap: 12px;
    }

    .btn {
      min-height: 52px;
      padding: 0 22px;
      border: 0;
      border-radius: 18px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
    }

    .btn.secondary {
      color: var(--ink);
      background: #ece7de;
    }

    .btn.primary {
      color: #fffaf0;
      background: linear-gradient(135deg, var(--ink), var(--teal));
      box-shadow: 0 18px 40px rgba(17, 122, 104, .24);
    }

    .variant-a {
      display: grid;
      grid-template-columns: minmax(0, 1.9fr) 400px;
      gap: 16px;
    }

    .sidebar-shell {
      display: grid;
      gap: 16px;
    }

    .state-panel {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: min(360px, calc(100vw - 36px));
      max-height: 38vh;
      overflow: auto;
      z-index: 45;
      padding: 14px;
      border-radius: 20px;
      background: rgba(255, 252, 245, .9);
      border: 1px solid rgba(23, 35, 31, .08);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .state-panel h3 {
      margin-bottom: 10px;
      font-size: 13px;
      text-transform: uppercase;
    }

    .state-panel pre {
      white-space: pre-wrap;
      color: var(--muted);
      font: 12px/1.45 var(--mono);
    }

    @media (max-width: 1220px) {
      .variant-a {
        grid-template-columns: 1fr;
      }

      .row {
        grid-template-columns: auto minmax(0, 1fr) auto;
      }

      .bank { display: none; }
      .account-box, .cta-bar, .topbar { flex-direction: column; align-items: stretch; }
      .pill-row { justify-content: flex-start; }
      .select-chip { min-width: 0; width: 100%; }
      .state-panel { position: static; width: auto; max-height: none; margin-top: 16px; }
      .app-shell { padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const state = {
      step: "Revisar",
      file: "fatura-inter-2023-10.csv",
      account: "Banco Inter Cartao • ••••3449",
      selectedCount: 92,
      totalRows: 93,
      excludedCount: 1,
      excludedRows: [
        {
          merchant: "PAGAMENTO ON LINE",
          date: "02/05/2025",
          amount: "-R$ 3.885,99",
          hint: "Pagamento ignorado; importe a transferencia pelo extrato da conta."
        }
      ],
      includedRows: [
        { merchant: "A DE C BRITO DE SOUSA SAO JOSE DE R MA", date: "29/05/2025", amount: "R$ 26,00", hint: "Compra a vista" },
        { merchant: "UBER TRIP OSASCO BRA", date: "29/05/2025", amount: "R$ 18,02", hint: "Mobilidade" },
        { merchant: "CACAROLA REVIVER SAO LUIS MA", date: "29/05/2025", amount: "R$ 31,00", hint: "Restaurante" },
        { merchant: "MESSIAS BAR SAO LUIS MA", date: "29/05/2025", amount: "R$ 24,00", hint: "Alimentacao" }
      ]
    };

    function topbar() {
      return `
        <header class="topbar">
          <div class="brand">
            <div class="dots">
              <i class="dot red"></i>
              <i class="dot yellow"></i>
              <i class="dot green"></i>
            </div>
            <div>
              <div class="eyebrow">Importacao prototipo</div>
              <div class="title">Revisao de importacao</div>
            </div>
          </div>
          <div class="pill-row">
            <div class="pill">${state.file}</div>
            <div class="pill">Lista primeiro</div>
          </div>
        </header>
      `;
    }

    function transactionGroup(title, chip, rows, excluded) {
      return `
        <section class="group">
          <div class="group-header">
            <div class="group-title">${title}</div>
            <span class="meta">${chip}</span>
          </div>
          ${rows.map((row) => `
            <article class="row">
              <div class="check ${excluded ? "off" : ""}">${excluded ? "!" : "✓"}</div>
              <div class="bank">inter</div>
              <div class="desc">
                <strong>${row.merchant}</strong>
                <span>${row.hint}</span>
              </div>
              <div class="amount">
                <strong class="money">${row.amount}</strong>
                <span>${row.date}</span>
              </div>
            </article>
          `).join("")}
        </section>
      `;
    }

    function transactionsPanel() {
      return `
        <section class="surface panel transactions-shell">
          <div class="panel-header">
            <h2>Transacoes</h2>
            <span class="meta">${state.selectedCount} entram</span>
          </div>
          <div class="segmented-list">
            ${transactionGroup("Nao vao entrar agora", `${state.excludedCount} item`, state.excludedRows, true)}
            ${transactionGroup("Vao para classificacao", `${state.selectedCount} itens`, state.includedRows, false)}
          </div>
        </section>
      `;
    }

    function timelineVertical() {
      const items = [
        ["Triagem", "Agora", "current"],
        ["Classificacao", "Depois", ""],
        ["Revisao", "Fim", ""]
      ];
      return `
        <section class="surface panel timeline-panel">
          <div class="nav-caption">Wizard lateral</div>
          <div class="timeline">
            ${items.map((item, index) => `
              <article class="timeline-item ${item[2]}">
                <div class="eyebrow">${item[1]}</div>
                <h3>${item[0]}</h3>
                <span class="micro">${index === 0 ? "ativa" : "disponivel"}</span>
              </article>
            `).join("")}
          </div>
          <div class="sidebar-actions">
            ${ctaBar()}
          </div>
        </section>
      `;
    }

    function accountPanel() {
      return `
        <section class="surface panel account-card">
          <div class="panel-header"><h2>Conta de destino</h2></div>
          <div class="account-box">
            <div>
              <div class="meta">Selecionada</div>
              <div class="account-name">${state.account}</div>
            </div>
            <button class="select-chip">Trocar conta</button>
          </div>
        </section>
      `;
    }

    function ctaBar() {
      return `
        <section class="cta-bar">
          <div class="button-row">
            <button class="btn secondary">Voltar</button>
            <button class="btn primary">Avancar</button>
          </div>
        </section>
      `;
    }

    function variantA() {
      return `
        <section class="variant-a">
          <div class="page">
            ${transactionsPanel()}
            ${accountPanel()}
          </div>
          <div class="sidebar-shell">
            ${timelineVertical()}
          </div>
        </section>
      `;
    }

    function statePanel() {
      return `
        <aside class="state-panel">
          <h3>Estado visivel do prototipo</h3>
          <pre>${JSON.stringify({ state }, null, 2)}</pre>
        </aside>
      `;
    }

    function canvas() {
      return `
        <div class="app-shell">
          <section class="stage">
            <section class="window">
              ${topbar()}
              <p class="subtitle">Wizard lateral com 3 etapas.</p>
              <div style="height: 16px"></div>
              ${variantA()}
            </section>
          </section>
          ${statePanel()}
        </div>
      `;
    }

    function render() {
      document.getElementById("root").innerHTML = canvas();
    }

    render();
  </script>
</body>
</html>
